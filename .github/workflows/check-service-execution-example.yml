name: Check Service Execution Example
on:
  push:
    branches:
      - master
    paths:
      - "examples/service-execution-jar/**"
      - ".github/workflows/check-service-execution-example.yml"
  pull_request:
    branches:
      - master
    paths:
      - "examples/service-execution-jar/**"
      - ".github/workflows/check-service-execution-example.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-guided-tour-application:
    name: Build and test (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./examples/service-execution-jar/legend-guided-tour-application
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: examples/service-execution-jar/legend-guided-tour-application/pom.xml
      - name: Show toolchain
        run: |
          java -version
          mvn -v
      - name: Build and test
        run: mvn -B -ntp clean verify -DskipTests=false -Dmaven.test.skip=false
      - name: Verify Java 17 bytecode and executable jar
        run: |
          javap -verbose -classpath target/legend-guided-tour-application-0.0.1-SNAPSHOT.jar \
            org.finos.legend.demo.app.LegendApplication | grep 'major version: 61'
          javap -verbose -classpath target/legend-guided-tour-application-0.0.1-SNAPSHOT-shaded.jar \
            org.finos.legend.demo.app.LegendApplication | grep 'major version: 61'
          java -jar target/legend-guided-tour-application-0.0.1-SNAPSHOT-shaded.jar
